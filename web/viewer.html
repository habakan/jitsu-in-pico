<!DOCTYPE html>
<!-- PSBT ビューア。実機に積んでいるのと同じ parser.wasm で解析し、同じ内容を表示する。
     鍵は扱わない。tools/build_viewer.py が wasm を埋め込んだ単一ファイルを作る -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSBT viewer</title>
<style>
  :root { color-scheme: dark; --bg:#13151a; --fg:#e8e8e8; --dim:#8b93a1; --line:#2a2e37;
          --send:#ff6e50; --ours:#5adc78; --title:#ffaa00; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size:16px; color:var(--title); margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .drop { border:1px dashed var(--line); border-radius:8px; padding:24px 16px; text-align:center; color:var(--dim); }
  .drop.over { border-color:var(--title); color:var(--fg); }
  textarea { width:100%; height:80px; margin-top:12px; background:#0d0f13; color:var(--fg);
             border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  button { background:#242833; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--title); }
  .card { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:12px 0; }
  .row { display:flex; justify-content:space-between; gap:12px; }
  .amount { color:var(--send); font-weight:600; }
  .mine .amount { color:var(--ours); }
  .addr { word-break:break-all; color:var(--fg); font-size:13px; }
  .k { color:var(--dim); }
  .err { color:var(--send); }
  footer { margin-top:28px; padding-top:12px; border-top:1px solid var(--line);
           color:var(--dim); font-size:11px; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>PSBT viewer</h1>
  <div class="sub">署名器に積んでいるのと同じ parser.wasm で解析します。鍵は扱いません。オフラインで動きます。</div>

  <div class="drop" id="drop">
    .psbt ファイルをドロップするか、<button id="pick">選ぶ</button>
    <input type="file" id="file" hidden accept=".psbt,.bin">
    <textarea id="text" placeholder="base64 か 16 進の PSBT を貼ってもよい"></textarea>
    <div class="row" style="margin-top:8px">
      <label class="k"><input type="checkbox" id="testnet"> testnet / signet として表示</label>
      <button id="parse">解析する</button>
    </div>
  </div>

  <div class="card" id="cam">
    <div class="row">
      <span class="k">カメラでアニメーション QR（UR）を読む</span>
      <span><select id="camsel" style="display:none;background:#242833;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px"></select>
      <button id="camstart">開始</button>
      <button id="camsave" style="display:none">フレームを保存</button></span>
    </div>
    <div style="position:relative;margin-top:8px">
      <video id="video" playsinline muted style="width:100%;display:none;border-radius:6px"></video>
      <div id="cambox" style="display:none;position:absolute;left:25%;top:25%;width:50%;height:50%;border:2px dashed #ffaa00;border-radius:6px;pointer-events:none"></div>
    </div>
    <div class="k" id="camstat"></div>
  </div>

  <div id="out"></div>

  <footer>
    parser.wasm __PARSER_SHA256__<br>
    address.wasm __ADDRESS_SHA256__<br>
    qr.wasm __QR_SHA256__
  </footer>
</main>

<script>
const PARSER_WASM = "__PARSER_WASM__", ADDRESS_WASM = "__ADDRESS_WASM__", QR_WASM = "__QR_WASM__";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
/* instantiateStreaming は MIME 型を要求するので、file:// でも動くようバイト列から読む */
const load = async s => (await WebAssembly.instantiate(b64(s), {})).instance.exports;

let parser, address, qr;
const OFF = { // plan.h のレイアウト。_Static_assert で固定してある
  inputs: 24, outputs: 2840, inSize: 176, outSize: 136,
  in: { amount: 40, spk: 48, key: 132 }, out: { amount: 0, spk: 8, key: 92 },
  key: { depth: 0, fp: 4, path: 8 },
};

const btc = sats => (Number(sats) / 1e8).toFixed(8);
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, "0")).join("");

function script(dv, base) { // plan_script_t: len + bytes
  const len = dv.getUint8(base);
  return new Uint8Array(dv.buffer, dv.byteOffset + base + 1, len);
}

function keypath(dv, base) {
  const depth = dv.getUint8(base + OFF.key.depth);
  if (!depth) return null;
  const fp = dv.getUint32(base + OFF.key.fp, true).toString(16).padStart(8, "0");
  const path = [];
  for (let i = 0; i < depth; i++) {
    const v = dv.getUint32(base + OFF.key.path + 4 * i, true);
    path.push((v & 0x7fffffff) + (v & 0x80000000 ? "'" : ""));
  }
  return { fp, path: "m/" + path.join("/") };
}

function toAddress(spk, testnet) {
  const mem = new Uint8Array(address.memory.buffer);
  mem.set(spk, address.addr_spk());
  if (!address.addr_encode(spk.length, testnet ? 1 : 0)) return null;
  let s = "", p = address.addr_out();
  while (mem[p]) s += String.fromCharCode(mem[p++]);
  return s;
}

function render(dv, testnet) {
  const nIn = dv.getUint8(16), nOut = dv.getUint8(17);
  let spent = 0n, sent = 0n;
  const parts = [];

  for (let i = 0; i < nOut; i++) {
    const base = OFF.outputs + i * OFF.outSize;
    const amount = dv.getBigUint64(base + OFF.out.amount, true);
    const key = keypath(dv, base + OFF.out.key);
    const spk = script(dv, base + OFF.out.spk);
    const addr = toAddress(spk, testnet);
    sent += amount;
    parts.push(`<div class="card ${key ? "mine" : ""}">
      <div class="row"><span class="k">出力 ${i + 1}/${nOut}${key ? "（自分の鍵）" : ""}</span>
        <span class="amount">${btc(amount)} BTC</span></div>
      <div class="addr">${addr || hex(spk)}</div>
      ${key ? `<div class="k">${key.path}  fp ${key.fp}</div>` : ""}
    </div>`);
  }

  for (let i = 0; i < nIn; i++) {
    const base = OFF.inputs + i * OFF.inSize;
    spent += dv.getBigUint64(base + OFF.in.amount, true);
  }

  const fee = spent - sent;
  return `<div class="card">
      <div class="row"><span class="k">入力 ${nIn} 件の合計</span><span>${btc(spent)} BTC</span></div>
      <div class="row"><span class="k">手数料</span><span class="amount">${btc(fee)} BTC</span></div>
      <div class="k">version ${dv.getInt32(8, true)}  locktime ${dv.getUint32(12, true)}</div>
    </div>` + parts.join("");
}

async function parse(bytes) {
  const out = document.getElementById("out");
  try {
    parser ||= await load(PARSER_WASM);
    address ||= await load(ADDRESS_WASM);
    const mem = new Uint8Array(parser.memory.buffer);
    if (bytes.length > parser.parser_input_cap()) throw new Error("PSBT が大きすぎます");
    mem.set(bytes, parser.parser_input());
    const rc = parser.parser_parse(bytes.length, 0); // fingerprint 0 = 鍵を持たないので所有判定はしない
    if (rc !== 0) throw new Error(`parser_parse が ${rc} を返しました（0 が受理）`);
    const dv = new DataView(parser.memory.buffer, parser.parser_plan(), 5016);
    out.innerHTML = render(dv, document.getElementById("testnet").checked);
  } catch (e) {
    out.innerHTML = `<div class="card err">${e.message}</div>`;
  }
}

/* カメラ: 実機と同じ quirc（qr.wasm）で読み、parser.wasm の UR 復元に渡す */
async function camera() {
  const video = document.getElementById("video"), stat = document.getElementById("camstat");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const seen = new Set();
  let W = 0, H = 0, mode = 0;

  parser ||= await load(PARSER_WASM);
  address ||= await load(ADDRESS_WASM);
  qr ||= await load(QR_WASM);
  parser.parser_ur_reset();

  const sel = document.getElementById("camsel");
  let stream;
  try {
    /* 解析は中央を等倍で切り出すので、センサーは高いほどモジュールが大きく写る */
    const want = Object.assign({ width: { ideal: 1920 }, height: { ideal: 1080 } },
                               sel.value ? { deviceId: { exact: sel.value } } : { facingMode: "environment" });
    stream = await navigator.mediaDevices.getUserMedia({ video: want });
  } catch (e) {
    stat.textContent = `カメラを開けません: ${e.name}。file:// では使えないブラウザがあります`;
    return;
  }
  /* 許可が下りてから名前が取れる。複数あれば選べるようにする */
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  if (cams.length > 1 && !sel.options.length) {
    cams.forEach((c, i) => sel.add(new Option(c.label || `カメラ ${i + 1}`, c.deviceId)));
    sel.value = stream.getVideoTracks()[0].getSettings().deviceId || cams[0].deviceId;
    sel.style.display = "inline-block";
    sel.onchange = () => { stream.getTracks().forEach(t => t.stop()); camera(); };
  }
  video.srcObject = stream;
  video.style.display = "block";
  await video.play();

  /* 画面全体を縮めると 1 モジュールが 2px 程度になって復号できない。
   * 中央の半分を等倍で切り出し、解像度を保ったままデコーダのメモリに収める */
  const box = document.getElementById("cambox");
  /* 読めないときに実物を見られるよう、そのまま解析に渡している画像を落とせるようにする */
  const save = document.getElementById("camsave");
  save.style.display = "inline-block";
  save.onclick = () => canvas.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "qr-frame.png";
    a.click();
  });
  const tick = () => {
    if (!video.videoWidth) return requestAnimationFrame(tick);
    if (W !== (video.videoWidth >> 1)) {
      W = canvas.width = video.videoWidth >> 1;
      H = canvas.height = video.videoHeight >> 1;
      box.style.display = "block";
      if (!qr.qr_init(W, H)) { stat.textContent = "QR デコーダの初期化に失敗"; return; }
      stat.textContent = `${video.videoWidth}x${video.videoHeight} の中央 ${W}x${H} を見ている`;
    }
    /* 中央の等倍（QR が小さく写るとき）と全体の縮小（枠からはみ出すとき）を交互に試す。
     * 鏡像だと位置検出だけ通って復号が落ちるので、失敗したら左右を反転してもう一度 */
    if (mode & 1) ctx.drawImage(video, W >> 1, H >> 1, W, H, 0, 0, W, H);
    else ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, 0, 0, W, H);
    box.style.display = (mode & 1) ? "block" : "none";
    const rgba = ctx.getImageData(0, 0, W, H).data;
    const gray = new Uint8Array(qr.memory.buffer, qr.qr_image(), W * H);
    for (let i = 0, j = 0; i < gray.length; i++, j += 4)  // ITU-R BT.601 の輝度
      gray[i] = (rgba[j] * 77 + rgba[j + 1] * 150 + rgba[j + 2] * 29) >> 8;

    let n = qr.qr_decode(), how = (mode & 1) ? "中央" : "全体";
    if (n <= 0) {
      for (let y = 0; y < H; y++)
        for (let a = y * W, b = a + W - 1; a < b; a++, b--) {
          const t = gray[a]; gray[a] = gray[b]; gray[b] = t;
        }
      const m = qr.qr_decode();
      if (m > 0) { n = m; how += "・鏡像"; }
    }
    mode++;
    if (n > 0) {
      const text = new TextDecoder().decode(new Uint8Array(qr.memory.buffer, qr.qr_payload(), n));
      /* デバイスの Show xpub は UR ではなく素のディスクリプタを出す。手で打たずに済むよう拾う */
      if (!text.startsWith("UR:")) {
        stream.getTracks().forEach(t => t.stop());
        video.style.display = "none";
        stat.innerHTML = "";
        const box = document.createElement("textarea");
        box.readOnly = true; box.rows = 3; box.value = text;
        box.style.cssText = "width:100%;background:#242833;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px ui-monospace,monospace";
        stat.append(`${n} 文字を読んだ（${how}）`, box);
        return;
      }
      const pm = new Uint8Array(parser.memory.buffer);
      pm.set(new TextEncoder().encode(text), parser.parser_input());
      const rc = parser.parser_ur_receive(n);
      if (rc > 0) {                                   // PSBT が揃った
        stream.getTracks().forEach(t => t.stop());
        video.style.display = "none";
        stat.textContent = `${seen.size + 1} パートで復元（${rc} byte、${how}）`;
        const psbt = new Uint8Array(parser.memory.buffer, parser.parser_input(), rc).slice();
        return parse(psbt);
      }
      if (rc === 0) {
        seen.add(text.split("/")[1]);
        const m = text.match(/\/(\d+)-(\d+)\//);
        stat.textContent = m ? `${seen.size}/${m[2]} パート` : `${seen.size} パート`;
      } else {
        stat.textContent = `UR エラー ${rc}`;
      }
    } else if (n < 0) {
      const px = qr.qr_last_px(), cells = qr.qr_last_cells();
      stat.textContent = `QR は見えているが読めない: ${px}px / ${cells}モジュール`
        + ` = ${(px / (cells || 1)).toFixed(1)}px/モジュール（${how}、${qr.qr_last_err()}）`;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

document.getElementById("camstart").onclick = camera;

function fromText(s) {
  s = s.trim().replace(/\s+/g, "");
  if (/^[0-9a-fA-F]+$/.test(s) && s.length % 2 === 0)
    return Uint8Array.from(s.match(/../g).map(h => parseInt(h, 16)));
  return b64(s);
}

const drop = document.getElementById("drop"), file = document.getElementById("file");
document.getElementById("pick").onclick = () => file.click();
file.onchange = async () => file.files[0] && parse(new Uint8Array(await file.files[0].arrayBuffer()));
document.getElementById("parse").onclick = () => {
  const t = document.getElementById("text").value;
  if (t.trim()) parse(fromText(t));
};
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = async e => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) parse(new Uint8Array(await e.dataTransfer.files[0].arrayBuffer()));
};
</script>
</body>
</html>
