name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 成果物が公開ソースから再現できることの確認。このプロジェクトの主張の土台なので最初に置く
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v5
      - name: 依存（wasm のビルドに要るものだけ）
        run: make deps-host
      - name: 固定した commit か
        run: make check-deps
      - name: ツールチェーンを取得（版とハッシュを固定）
        run: ./tools/toolchain.sh
      - name: 5 つの wasm を作り直して記録と突き合わせる
        run: make check-repro
      - name: 配る形が正しいか（import 0 / メモリ固定 / 可変 global を輸出しない）
        run: |
          V=1.261.0
          curl -sL -o /tmp/wt.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v$V/wasm-tools-$V-x86_64-linux.tar.gz
          tar xzf /tmp/wt.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-$V-x86_64-linux/wasm-tools /usr/local/bin/
          wasm-tools --version
          make check-wasm

  # ホストで動く検査一式
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v5
      - name: 依存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang lld
          make deps-host
          ./tools/toolchain.sh          # parser.wasm のビルドに要る
      - run: make check-core
      - run: make check-xpub
      - run: make check-seedqr
      - run: make check-ui
      - name: PSBT 一巡（WAMR + ネイティブ中核、署名を embit で独立検証）
        run: |
          SDK=$(./tools/toolchain.sh)
          make check-psbt LLVM=$PWD/$SDK/bin WASI=$PWD/$SDK/share/wasi-sysroot \
            RTLIB=$PWD/$SDK/lib/clang/23/lib/wasm32-unknown-wasi \
            WASM_OPT=$PWD/build/toolchain/binaryen-version_132/bin/wasm-opt

  # 解析器。別リポジトリの部品なので独立した仕事として回す
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v5
      - name: 依存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          ./tools/toolchain.sh
      - name: wasm-tools（輸出集合の検査に要る）
        run: |
          V=1.261.0
          curl -sL -o /tmp/wt.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v$V/wasm-tools-$V-x86_64-linux.tar.gz
          tar xzf /tmp/wt.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-$V-x86_64-linux/wasm-tools /usr/local/bin/
      - name: ベクタ（529 項目）とホスト（79 項目）
        run: |
          SDK=$(./tools/toolchain.sh)
          make -C components/parser test \
            LLVM=$PWD/$SDK/bin WASI=$PWD/$SDK/share/wasi-sysroot \
            RTLIB=$PWD/$SDK/lib/clang/23/lib/wasm32-unknown-wasi \
            WASM_OPT=$PWD/build/toolchain/binaryen-version_132/bin/wasm-opt
      - name: ファジング（短い決まった回数）
        run: make -C components/parser check-fuzz LLVM=/usr/bin
